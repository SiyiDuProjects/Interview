name: Deploy interview server

on:
  push:
    branches: ["main"]
    paths:
      - "apps/server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-interview-server
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run realtime tests
        run: python -m unittest tests.test_realtime

      - name: Run API tests
        run: python -m unittest tests.test_interview_flow tests.test_latency

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Sync server files
        env:
          DEPLOY_PATH: ${{ secrets.INTERVIEW_DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_PATH"
          ssh deploy-server "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            apps/server/ deploy-server:"$DEPLOY_PATH"/

      - name: Rebuild container
        env:
          COMPOSE_PATH: ${{ secrets.COMPOSE_PATH }}
        run: |
          test -n "$COMPOSE_PATH"
          ssh deploy-server "COMPOSE_PATH='$COMPOSE_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$COMPOSE_PATH"
          sudo docker compose build interview_api
          if ! sudo docker compose up -d --no-build --force-recreate --remove-orphans interview_api; then
            sudo docker compose rm -fs interview_api || true
            sudo docker rm -f interview_api 2>/dev/null || true
            sudo docker compose up -d --no-build --force-recreate --remove-orphans interview_api
          fi
          sudo docker logs --tail=80 interview_api
          REMOTE

      - name: Health check
        env:
          PUBLIC_HEALTH_URL: ${{ secrets.INTERVIEW_PUBLIC_HEALTH_URL }}
        run: |
          test -n "$PUBLIC_HEALTH_URL"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "$PUBLIC_HEALTH_URL"; then
              exit 0
            fi
            echo "Health check failed; retrying in 5 seconds ($attempt/24)."
            sleep 5
          done
          curl --fail --silent --show-error "$PUBLIC_HEALTH_URL"
