name: Deploy interview server

on:
  push:
    branches: ["main"]
    paths:
      - "apps/server/**"
      - "apps/desktop/index.html"
      - "apps/desktop/package.json"
      - "apps/desktop/package-lock.json"
      - "apps/desktop/src/**"
      - "apps/desktop/public/**"
      - "apps/desktop/tsconfig.json"
      - "apps/desktop/vite.config.ts"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-interview-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build shared web client
        working-directory: apps/desktop
        run: |
          npm ci
          npm run test:ui
          npm run test:capture
          npm run build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt

      - name: Run backend regression tests
        run: python -m unittest discover -s tests

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Stage shared web client
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          rm -rf ../server/web
          mkdir -p ../server/web
          cp -a dist/. ../server/web/

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Stage release without changing the running server
        env:
          DEPLOY_PATH: ${{ secrets.INTERVIEW_DEPLOY_PATH || secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_PATH"
          STAGING_PATH="${DEPLOY_PATH}.incoming-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh deploy-server "mkdir -p -- $(printf '%q' "$STAGING_PATH")"
          rsync -az \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            apps/server/ "deploy-server:$STAGING_PATH/"

      - name: Drain, release, verify protocol and models, and retain rollback
        env:
          DEPLOY_PATH: ${{ secrets.INTERVIEW_DEPLOY_PATH || secrets.DEPLOY_PATH }}
          COMPOSE_PATH: ${{ secrets.COMPOSE_PATH }}
          PUBLIC_HEALTH_URL: ${{ secrets.INTERVIEW_PUBLIC_HEALTH_URL || secrets.PUBLIC_HEALTH_URL }}
        run: |
          test -n "$DEPLOY_PATH"
          test -n "$COMPOSE_PATH"
          test -n "$PUBLIC_HEALTH_URL"
          RELEASE_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STAGING_PATH="${DEPLOY_PATH}.incoming-${RELEASE_ID}"
          # The remote program atomically refuses active interviews before
          # touching deployed source/.env. It never removes shared orphans.
          printf -v remote_command 'sudo python3 %q --deploy-path %q --compose-path %q --staging-path %q --health-url %q --release-id %q' \
            "$STAGING_PATH/deploy/release.py" "$DEPLOY_PATH" "$COMPOSE_PATH" "$STAGING_PATH" "$PUBLIC_HEALTH_URL" "$RELEASE_ID"
          ssh deploy-server "$remote_command"
